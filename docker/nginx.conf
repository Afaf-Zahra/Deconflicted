server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's own DNS. Using a variable makes nginx look the api up on each request,
    # so nginx starts even when the api is not up yet. The short timeouts make a missing api fail fast.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;

    # The screens call these paths. They go to the api, so the same URLs work in dev and in Docker.
    location ~ ^/(incidents|budget|events|response|ledger|audit|decoys|debug|ingest|health)(/|$) {
        set $api http://api:8000;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # The same API under /api, as the dev server does. `set` must come before `rewrite ... break`.
    location /api/ {
        set $api http://api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}